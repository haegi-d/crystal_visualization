# Default style preset — permissive values for exploration and drafts.
# Override per-key by copying this file to a new preset name.

[figure]
dpi = 300
width_mm = 120
height_mm = 120
background = "white"

[atoms.colors]
# CPK color scheme, standard crystallographic convention.
H  = "#ffffff"
C  = "#404040"
N  = "#3050f8"
O  = "#ffba52"
F  = "#90e050"
Si = "#f0c8a0"
Y  = "#4b80f4"      # Yttrium — light cyan
Er = "#f64141"      # Erbium — bright green (distinct from host)
La = "#70d4ff"
Ce = "#ffffc7"
Gd = "#45ffa0"

[atoms.radii]
# Van der Waals radii in Å, scaled for figure aesthetics.
# Reduced ~30% from true VdW to avoid occlusion in cluster views.
H  = 0.25
C  = 0.35
N  = 0.32
O  = 0.50
F  = 0.28
Si = 0.38
Y  = 0.80
Er = 1
La = 0.55
Ce = 0.54
Gd = 0.51

[bonds]
cutoff_angstrom = 3.2   # Pairs closer than this receive a bond line.
color = "#666666"
linewidth = 0.8         # matplotlib linewidth; Blender tube radius set separately.

[annotations]
font_family = "Helvetica"
font_size = 10          # pt; applied to SVG text elements.
scale_bar_angstrom = 5  # Length of the scale bar indicator.
arrow_color = "#e03030" # Color of the 3D arrow placed above the center atom.

[crystal_box]
enabled         = true
color           = "#c8e4ff"   # Pale blue tint — adjust for journal style.
alpha           = 0.12        # Base transparency of the box faces.
ior             = 1.45        # Index of refraction (glass ≈ 1.5).
roughness       = 0.02        # 0 = mirror-smooth; 0.05 = very slight frost.
iridescence     = 0.40        # Rainbow edge shimmer intensity (0–1).
rim_strength    = 0.35        # Brightness of the Fresnel rim glow.
padding_angstrom = 0.8        # Extra space beyond atom extents on each side.

[nanowire]
enabled       = false

[substrate]
enabled       = false
