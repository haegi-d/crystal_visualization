[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crystal_visualization"
version = "0.1.0"
description = "Publication-quality visualization of crystal defects"
requires-python = ">=3.11"
dependencies = [
    "ase>=3.23",
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "plotly>=5.20",
    "svgwrite>=1.4",
    "Pillow>=10.2",
    "cairosvg>=2.7",
]

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "ruff>=0.4",
    "pytest>=8.0",
]
# bpy (Blender) is intentionally not listed here.
# See DESIGN.md §2 for installation options.

[project.scripts]
crystal-render = "scripts.render:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["crystal_visualization*"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
